plugins { id 'com.android.application' }

android {
    namespace 'com.adas'
    // 37 is the only platform this machine's SDK has installed; anything lower
    // triggers a download. targetSdk stays at 36 (a shipped release) because
    // targeting does not require the platform to be present locally.
    compileSdk 37

    defaultConfig {
        applicationId "com.adas"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Needed by AlertEngineParityTest, which runs on a device because it
        // exercises real android.graphics.RectF geometry.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Do NOT let the build tools compress these, or memory-mapping fails.
    // 'bin' is the offline road index read by RoadIndex.java. Both it and the
    // models are opened with AssetManager.openFd() + FileChannel.map(), and a
    // compressed asset has no file descriptor to map — openFd() then throws
    // FileNotFoundException with a message about compression that looks nothing
    // like the real cause. Anything memory-mapped has to be listed here.
    androidResources { noCompress 'tflite', 'bin' }

    // Plain JVM unit tests, no device needed. LaneDeparture's geometry decides
    // whether a lane warning fires, and until now the only way to exercise it
    // was to drive a car. returnDefaultValues lets classes that merely MENTION
    // android types load on the desktop JVM; nothing under test calls into the
    // framework.
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // -gpu carries the native .so and GpuDelegate; -gpu-api carries the
    // GpuDelegateFactory base class that GpuDelegate.Options extends. Without the
    // second one the first will not even compile.
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.16.1'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    testImplementation 'junit:junit:4.13.2'
}
